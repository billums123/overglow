<!doctype html><html><head><meta charset="utf-8">
<style>
/* The source is a finished 1672x941 artwork already on black. Nothing is
   composited over it, no blend mode and no filter — both were degrading the
   glow gradient. It simply fills the frame, downscaled from 1672 to 1200 so it
   is never stretched. */
*{margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:#000}
img{width:100%;height:100%;object-fit:cover;display:block}
</style></head><body>
<img src="wordmark-card.png" alt="overglow">
</body></html>
