<!doctype html><html><head><meta charset="utf-8">
<style>
/* The source wordmark is 1500x540. Rendering the card at 1x and sizing the
   image to 1100px means it is always DOWNSCALED, never stretched — which is
   what went wrong before: a 2x card forced this art past its pixel count. */
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#000;position:relative}
.bg{position:absolute;inset:0;
  background:radial-gradient(760px 540px at 86% 10%, rgba(61,232,212,.12), transparent 68%),
             radial-gradient(660px 500px at 8% 94%, rgba(255,45,149,.11), transparent 66%)}
.mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:1100px;display:block;mix-blend-mode:screen;
  /* its background is near-black rather than black, so screen leaves a faint
     lifted rectangle; contrast crushes that back down */
  filter:contrast(1.32) brightness(1.03)}
</style></head><body>
<div class="bg"></div>
<img class="mark" src="wordmark-card.png" alt="overglow">
</body></html>
