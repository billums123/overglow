<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;
  font-family:Inter,-apple-system,"SF Pro Text",sans-serif;-webkit-font-smoothing:antialiased;
  background:#1A1036;position:relative}
.bg{position:absolute;inset:0;
  background:
    radial-gradient(900px 620px at 72% 18%, rgba(158,119,237,.55), transparent 62%),
    radial-gradient(700px 520px at 18% 88%, rgba(105,65,198,.45), transparent 64%),
    linear-gradient(145deg,#241546 0%,#170E2E 55%,#120A24 100%);}
.grain{position:absolute;inset:0;opacity:.35;
  background:radial-gradient(1100px 700px at 50% 42%, rgba(255,255,255,.07), transparent 70%)}
.inner{position:relative;height:100%;padding:62px 72px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;color:#fff;font-weight:700;font-size:26px;letter-spacing:-.01em}
.mark{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,#9E77ED,#6941C6);
  box-shadow:0 0 34px rgba(158,119,237,.85),0 6px 16px rgba(0,0,0,.35)}
h1{color:#fff;font-size:104px;line-height:1.02;font-weight:800;letter-spacing:-.045em}
.glow{display:inline-block;color:#fff;
  text-shadow:0 0 24px rgba(255,255,255,1),0 0 66px rgba(255,255,255,.85),0 0 130px rgba(214,196,255,.6)}
p.sub{margin-top:26px;color:rgba(255,255,255,.72);font-size:28px;font-weight:500;letter-spacing:-.01em;max-width:830px;line-height:1.4}
.foot{display:flex;align-items:center;justify-content:space-between}
.url{color:#fff;font-size:24px;font-weight:600;letter-spacing:-.01em;opacity:.95}
.tags{display:flex;gap:10px}
.tag{font-size:19px;font-weight:600;color:rgba(255,255,255,.82);
  border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.07);
  border-radius:999px;padding:8px 18px}
</style></head><body>
<div class="bg"></div><div class="grain"></div>
<div class="inner">
  <div class="brand">
    <div class="mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="3.5" fill="#fff"/>
      <circle cx="12" cy="12" r="7" stroke="#fff" stroke-opacity=".55" stroke-width="1.6"/>
      <circle cx="12" cy="12" r="10.6" stroke="#fff" stroke-opacity=".25" stroke-width="1.6"/></svg></div>
    overglow
  </div>
  <div>
    <h1>Brighter than<br><span class="glow">white.</span></h1>
    <p class="sub">Give any logo a real HDR glow. Runs entirely in your browser.</p>
  </div>
  <div class="foot">
    <div class="url">overglow.hestermani.com</div>
    <div class="tags"><div class="tag">Rec.2100 PQ</div><div class="tag">No upload</div></div>
  </div>
</div></body></html>
